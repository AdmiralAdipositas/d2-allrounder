<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>D2 Allrounder</title>
<meta name="theme-color" content="#0b0a1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<nav id="rail" aria-label="Main">
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13"/><path d="M16 5l4 11-4 11-4-11z"/></svg><span>D2 Allrounder</span></div>
  <div class="gruppe" role="tablist">
    <button data-tab="vault" class="an" role="tab"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="15" rx="2"/><circle cx="11" cy="11.5" r="3.5"/><path d="M11 8v1.5M11 13.5V15M7.5 11.5H9M13 11.5h1.5M18 9v5"/></svg><span>Weapons</span></button>
    <button data-tab="armor" role="tab"><svg viewBox="0 0 24 24"><path d="M5 11a7 7 0 0 1 14 0v4l-3 4H8l-3-4z"/><path d="M8 12h8M12 12v5"/></svg><span>Armor</span></button>
    <button data-tab="loadouts" role="tab"><svg viewBox="0 0 24 24"><path d="M12 3l8 4v10l-8 4-8-4V7z"/><path d="M4 7l8 4 8-4M12 11v10"/></svg><span>Loadouts</span></button>
    <button data-tab="optimizer" role="tab"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Optimizer</span></button>
    <button data-tab="finder" role="tab"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg><span>Build Finder</span></button>
    <button data-tab="stats" role="tab"><svg viewBox="0 0 24 24"><path d="M4 19h16M7 16V9M12 16V5M17 16v-4"/></svg><span>Stats</span></button>
  </div>
  <div class="trenner"></div>
  <div class="gruppe">
    <button data-panel="woche"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Side panel</span></button>
  </div>
  <div class="unten">
    <button id="konto"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/></svg><span id="kontoName">Sign in</span></button>
  </div>
</nav>
<main id="haupt" tabindex="-1"></main>
<aside id="panel" hidden aria-label="Side panel"></aside>
<div id="tipp" hidden></div>
<div id="meldung" role="status"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
