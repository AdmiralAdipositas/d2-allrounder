<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>D2 Allrounder</title>
<meta name="theme-color" content="#0b0a1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<nav id="rail" aria-label="Main">
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13"/><path d="M16 5l4 11-4 11-4-11z"/></svg><span>D2 Allrounder</span></div>
  <div class="gruppe" role="tablist">
    <button data-tab="vault" class="an" role="tab"><svg viewBox="0 0 24 24"><path d="M20 4l-1 4.5L9.5 18 6 14.5 15.5 5z"/><path d="M5 13l6 6"/><path d="M7.5 16.5L4 20"/><path d="M3 19l2 2"/></svg><span>Weapons</span></button>
    <button data-tab="armor" role="tab"><svg viewBox="0 0 24 24"><path d="M8 3L4 5.5v5l2 1V20h12v-8.5l2-1v-5L16 3"/><path d="M8 3c1 2 2.5 3 4 3s3-1 4-3"/><path d="M12 6v14M8 12h8"/></svg><span>Armor</span></button>
    <button data-tab="loadouts" role="tab"><svg viewBox="0 0 24 24"><path d="M12 3l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></svg><span>Loadouts</span></button>
    <button data-tab="optimizer" role="tab"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Optimizer</span></button>
    <button data-tab="finder" role="tab"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="M14.5 14.5L20 20"/><path d="M10 7l.9 2.1L13 10l-2.1.9L10 13l-.9-2.1L7 10l2.1-.9z"/></svg><span>Build Finder</span></button>
    <button data-tab="wiki" role="tab"><svg viewBox="0 0 24 24"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H20v15H5.5A1.5 1.5 0 0 0 4 19.5z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H20"/><path d="M9 8h7M9 11.5h5"/></svg><span>Wiki</span></button>
    <button data-tab="guide" role="tab"><svg viewBox="0 0 24 24"><path d="M12 2l3 6 6 1-4.5 4.5L17.5 20 12 17l-5.5 3 1-6.5L3 9l6-1z"/></svg><span>Raid Guide</span></button>
    <button data-tab="stats" role="tab"><svg viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M4 16l5-5 4 3 7-8"/><path d="M16 6h4v4"/></svg><span>Stats</span></button>
  </div>
  <div class="trenner"></div>
  <div class="gruppe">
    <button data-panel="woche"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/><path d="M17.5 8h1.5M17.5 11h1.5M17.5 14h1.5"/></svg><span>Side panel</span></button>
  </div>
  <div class="unten">
    <button id="konto"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/></svg><span id="kontoName">Sign in</span></button>
  </div>
</nav>
<main id="haupt" tabindex="-1"></main>
<aside id="panel" hidden aria-label="Side panel"></aside>
<div id="tipp" hidden></div>
<div id="meldung" role="status"></div>
<script>
// Während eines Updates kann der Server kurz alte und neue Dateien mischen. Dann einmal neu laden statt leer zu bleiben.
addEventListener('error', (e) => {
  if (!/SyntaxError|does not provide an export|Failed to fetch dynamically/.test(String(e.message))) return;
  const n = Number(sessionStorage.getItem('d2a.modfix') || 0);
  if (n < 3) { sessionStorage.setItem('d2a.modfix', String(n + 1)); setTimeout(() => location.reload(), 2500 * (n + 1)); }
});
setTimeout(() => sessionStorage.removeItem('d2a.modfix'), 60000);
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
