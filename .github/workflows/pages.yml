# Baut täglich die Spieldaten neu und veröffentlicht die App auf GitHub Pages.
name: Build and publish
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 17 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Game data
        run: node tools/defs.mjs
      - name: God rolls
        run: node tools/rolls.mjs || echo 'Wish list not reachable, keeping the old one.'
      - name: Keep game data in the repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/defs.json data/rolls.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update game data" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
